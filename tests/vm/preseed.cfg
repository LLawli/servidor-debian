# Instalação automática que reproduz a seção 1 do README: UEFI, LUKS com LVM
# (grupo vg0), / em btrfs, /boot em ext4 fora do LUKS, root sem senha e o
# usuário developer no sudo. As senhas são de teste; a VM só escuta em
# 127.0.0.1.
# O netboot só traz C e inglês; o idioma não importa para o teste.
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select br
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string vm-sb
d-i netcfg/get_domain string
d-i netcfg/hostname string vm-sb
d-i hw-detect/load_firmware boolean true

d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i mirror/suite string testing

d-i passwd/root-login boolean false
d-i passwd/user-fullname string developer
d-i passwd/username string developer
d-i passwd/user-password password teste-sudo-123
d-i passwd/user-password-again password teste-sudo-123
d-i user-setup/allow-password-weak boolean true

d-i clock-setup/utc boolean true
d-i time/zone string America/Sao_Paulo
d-i clock-setup/ntp boolean false

d-i partman-auto/disk string /dev/vda
d-i partman-auto/method string crypto
d-i partman-auto-lvm/new_vg_name string vg0
d-i partman-auto-lvm/guided_size string max
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-crypto/passphrase password teste-luks-123
d-i partman-crypto/passphrase-again password teste-luks-123
d-i partman-crypto/weak_passphrase boolean true
d-i partman-crypto/erase_disks boolean false
d-i partman-auto-crypto/erase_disks boolean false
d-i partman-partitioning/choose_label select gpt
d-i partman-partitioning/default_label string gpt
d-i partman-auto/expert_recipe string servidor :: \
    1024 1024 1024 free $iflabel{ gpt } $reusemethod{ } method{ efi } format{ } . \
    2048 2048 2048 ext4 $primary{ } $bootable{ } method{ format } format{ } use_filesystem{ } filesystem{ ext4 } mountpoint{ /boot } . \
    6000 6000 -1 btrfs $lvmok{ } lv_name{ root } method{ format } format{ } use_filesystem{ } filesystem{ btrfs } mountpoint{ / } . \
    1024 1024 1024 linux-swap $lvmok{ } lv_name{ swap } method{ swap } format{ } .
d-i partman-auto/choose_recipe select servidor
d-i partman-basicfilesystems/no_swap boolean false
d-i partman/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/cdrom/set-first boolean false
tasksel tasksel/first multiselect standard, ssh-server
popularity-contest popularity-contest/participate boolean false

d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default
d-i debian-installer/add-kernel-opts string console=ttyS0,115200n8

d-i preseed/late_command string \
    mkdir -p /target/home/developer/.ssh; \
    cp /chave.pub /target/home/developer/.ssh/authorized_keys; \
    in-target chown -R developer:developer /home/developer/.ssh; \
    in-target chmod 700 /home/developer/.ssh

d-i finish-install/reboot_in_progress note
