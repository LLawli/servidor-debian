---
- name: Reinicia o logind
  ansible.builtin.systemd_service:
    name: systemd-logind
    state: restarted

- name: Reinicia o upower
  ansible.builtin.systemd_service:
    name: upower
    state: restarted
  # No --check o upower pode nem estar instalado ainda.
  when: not (ansible_check_mode and notebook_upower is changed)
