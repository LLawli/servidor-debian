---
- name: Confere se há TPM2
  ansible.builtin.stat:
    path: /dev/tpmrm0
  register: confiabilidade_dev_tpm

- name: Recusa sem TPM2
  ansible.builtin.assert:
    that: confiabilidade_dev_tpm.stat.exists
    fail_msg: "{{ inventory_hostname }} não tem /dev/tpmrm0; ligue o TPM na BIOS ou use confiabilidade_tpm: false."
    quiet: true

- name: Instala o clevis
  ansible.builtin.apt:
    name: [clevis, clevis-luks, clevis-tpm2, clevis-initramfs, tpm2-tools]
    state: present
    install_recommends: false
  notify: Atualiza o initramfs

- name: Lê o crypttab
  ansible.builtin.slurp:
    src: /etc/crypttab
  register: confiabilidade_crypttab
  when: not confiabilidade_luks_dispositivo

- name: Escolhe o dispositivo LUKS
  ansible.builtin.set_fact:
    confiabilidade_luks: >-
      {{ confiabilidade_luks_dispositivo
         or ((confiabilidade_crypttab.content | b64decode).splitlines()
             | reject('match', '^\s*(#|$)') | first).split()[1]
            | regex_replace('^UUID=', '/dev/disk/by-uuid/') }}

- name: Confere se o LUKS já tem slot do TPM2
  ansible.builtin.command:
    cmd: clevis luks list -d {{ confiabilidade_luks }}
  register: confiabilidade_clevis
  changed_when: false
  failed_when: false
  check_mode: false

# Um slot gravado com outro estado de boot (por exemplo, antes de ligar o
# Secure Boot) não abre mais o disco: o boot volta a pedir a senha. O teste
# decifra a chave do slot pelo TPM, sem imprimi-la.
- name: Testa os slots do TPM2 com o boot atual
  ansible.builtin.shell:
    cmd: clevis luks pass -d {{ confiabilidade_luks }} -s {{ item }} >/dev/null 2>&1
  loop: "{{ confiabilidade_clevis.stdout | regex_findall('(?m)^(\\d+): tpm2') }}"
  register: confiabilidade_slots
  changed_when: false
  failed_when: false
  check_mode: false

- name: Separa os slots que ainda abrem o disco
  ansible.builtin.set_fact:
    confiabilidade_slots_bons: "{{ confiabilidade_slots.results | selectattr('rc', 'equalto', 0) | map(attribute='item') | list }}"
    confiabilidade_slots_velhos: "{{ confiabilidade_slots.results | rejectattr('rc', 'equalto', 0) | map(attribute='item') | list }}"

- name: Liga o LUKS ao TPM2
  when: confiabilidade_slots_bons | length == 0 and not ansible_check_mode
  block:
    - name: Pede a senha atual do LUKS
      ansible.builtin.pause:
        prompt: "Senha atual do LUKS em {{ confiabilidade_luks }} ({{ inventory_hostname }})"
        echo: false
      register: confiabilidade_senha
      when: not confiabilidade_senha_luks

    - name: Apaga os slots do TPM2 que não abrem mais o disco
      ansible.builtin.command:
        cmd: clevis luks unbind -f -d {{ confiabilidade_luks }} -s {{ item }}
      loop: "{{ confiabilidade_slots_velhos }}"
      changed_when: true

    - name: Grava o slot do TPM2 (PCRs {{ confiabilidade_tpm_pcrs }})
      ansible.builtin.command:
        argv:
          - clevis
          - luks
          - bind
          - -y
          - -d
          - "{{ confiabilidade_luks }}"
          - -k
          - "-"
          - tpm2
          - '{"pcr_bank":"sha256","pcr_ids":"{{ confiabilidade_tpm_pcrs }}"}'
        stdin: "{{ confiabilidade_senha_luks or confiabilidade_senha.user_input }}"
      no_log: true
      changed_when: true
      notify: Atualiza o initramfs
